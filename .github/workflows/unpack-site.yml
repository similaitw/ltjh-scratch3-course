name: Unpack Scratch Course Site

on:
  push:
    paths:
      - '.github/workflows/unpack-site.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild site archive
        shell: bash
        run: |
          set -euo pipefail
          cat site.part1 site.part2 site.part3 site.part4 site.part5 site.part6 site.part7 site.part8 site.part9 | base64 --decode > site.tgz
          tar -xzf site.tgz
          rm -f site.tgz site.part1 site.part2 site.part3 site.part4 site.part5 site.part6 site.part7 site.part8 site.part9
          test -s index.html
          test -s styles.css
          test -s script.js
          test -s official-blocks.js
          test -s README.md
          test -s vercel.json

      - name: Commit unpacked site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Unpack Scratch course site v17"
            git push
          fi

# retry-after-all-parts-uploaded

